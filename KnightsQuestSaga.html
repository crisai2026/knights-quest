let ctx = null;
let master = null;
let musicGain = null;
let sfxGain = null;

function getCtx() {
    if (typeof window === "undefined")
        return null;
    if (!ctx) {
        const Ctor = window.AudioContext ?? window.webkitAudioContext;
        if (!Ctor)
            return null;
        ctx = new Ctor();
        master = ctx.createGain();
        master.gain.value = 0.9;
        master.connect(ctx.destination);
        musicGain = ctx.createGain();
        musicGain.gain.value = 0.18;
        musicGain.connect(master);
        sfxGain = ctx.createGain();
        sfxGain.gain.value = 0.5;
        sfxGain.connect(master);
    }
    if (ctx.state === "suspended")
        void ctx.resume();
    return ctx;
}
function noiseBuffer(ac, seconds) {
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * seconds), ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++)
        data[i] = Math.random() * 2 - 1;

}
function tone({ type = "sine", from, to, duration, volume = 0.3, delay = 0 }) {
    const ac = getCtx();
    if (!ac || !sfxGain || !enabled)

    const t = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, t);
    if (to !== undefined)
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + duration);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + Math.min(0.04, duration / 3));
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(sfxGain);
    osc.start(t);
    osc.stop(t + duration + 0.05);
}
function noise(duration, filter, freq, volume = 0.3, delay = 0, sweepTo) {
    const ac = getCtx();
    if (!ac || !sfxGain || !enabled)
        return;
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, Math.max(0.1, duration));
    const biquad = ac.createBiquadFilter();
    biquad.type = filter;
    biquad.frequency.setValueAtTime(freq, t);
    if (sweepTo !== undefined)
        biquad.frequency.exponentialRampToValueAtTime(Math.max(40, sweepTo), t + duration);
    const gain = ac.createGain();
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    src.start(t);
    src.stop(t + duration + 0.05);

const N = (name) => {
    const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const m = /^([A-G]#?)(\d)$/.exec(name);
    if (!m)
        return 440;
    const semitone = names.indexOf(m[1]) + (Number(m[2]) + 1) * 12;
    return 440 * Math.pow(2, (semitone - 69) / 12);
};
const n = (s) => (s ? N(s) : null);

let currentTrack = null;
let timer = null;
let step = 0;
let fireLoop = null;
function playMusicNote(freq, wave, ms, volume) {
    const ac = getCtx();
    if (!ac || !musicGain)
        return;
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, t);
    const dur = ms / 1000;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);
    osc.connect(gain).connect(musicGain);
    osc.start(t);
    osc.stop(t + dur);
}
function startFireAmbience() {
    const ac = getCtx();
    if (!ac || !musicGain || fireLoop)
        return;
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 2);
    src.loop = true;
    const filter = ac.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 700;
    const gain = ac.createGain();
    gain.gain.value = 0.5;
    src.connect(filter).connect(gain).connect(musicGain);
    src.start();
    fireLoop = { src, gain };
}
function stopFireAmbience() {
    if (!fireLoop)
        return;
    try {
        fireLoop.src.stop();
    }
    catch {
        /* already stopped */
    }
    fireLoop = null;
}
function runTrack(track) {
    const def = TRACKS[track];
    step = 0;
    if (timer)
        clearInterval(timer);
    timer = setInterval(() => {
        if (!enabled)
            return;
        const lead = def.lead[step % def.lead.length];
        const bass = def.bass[step % def.bass.length];
        if (lead)
            playMusicNote(lead, def.wave, def.stepMs * 0.9, def.gain);
        if (bass)
            playMusicNote(bass, "triangle", def.stepMs * 1.6, def.gain * 1.1);
        step++;
    }, def.stepMs);
}
function playMusic(track) {
    if (track === currentTrack)
        return;
    currentTrack = track;
    if (timer) {
        clearInterval(timer);
        timer = null;
    }
    stopFireAmbience();
    if (!track)
        return;
    if (!enabled)
        return;
    getCtx();
    if (track === "fire")
        startFireAmbience();
    runTrack(track);
}
function stopMusic() {
    playMusic(null);
}
function setMusicEnabled(value) {
    enabled = value;
    if (!value) {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        stopFireAmbience();
    }
    else if (currentTrack) {
        const track = currentTrack;
        currentTrack = null;
        playMusic(track);
    }
}
function isMusicEnabled() {
    return enabled;

    getCtx();

        playMusic(track);

/**
 * The knight's jump clears about 120px, so no platform may sit more than
 * MAX_RISE above the ground or above a nearby lower platform. Level layouts are
 * passed through this pass so every platform is reachable by a normal jump.
 */
const MAX_RISE = 80;
const REACH_GAP = 220;
function makeReachable(list) {
    const sorted = list.map((p) => ({ ...p })).sort((a, b) => a.x - b.x);
    for (let i = 0; i < sorted.length; i++) {
        const p = sorted[i];
        let support = GROUND_Y;
        for (let j = 0; j < i; j++) {
            const q = sorted[j];
            const gap = p.x - (q.x + q.width);
            if (gap < REACH_GAP && q.y < support)
                support = q.y;
        }
        const highest = support - MAX_RISE;
        if (p.y < highest)
            p.y = highest;
    }
    return sorted;
}

    for (const scene of level.scenes ?? []) {

}

function obj(x, y, color, tag, vy = 0) {

function createMinigame(kind, best) {

        hint: meta.hint,

    else if (kind === "corn") {

        for (let i = 0; i < 6; i++) {

            o.vy = 60 + Math.random() * 150; // frames until ripe
            state.objects.push(o);
        }
    }
    else if (kind === "herd") {
        for (let i = 0; i < 3; i++) {
            const o = obj(80 + i * 90, FLOOR_Y, "#f8fafc", "sheep");
            state.objects.push(o);
        }
    }
    else if (kind === "flowers") {
        for (let i = 0; i < 6; i++) {
            const f = randomFlower();
            state.objects.push(obj(80 + i * 120, FLOOR_Y, f.color, f.name));
        }
        state.prompt = randomFlower().name;
    }
    else if (kind === "buttons") {
        state.prompt = randomFlower().name;
    }
    else if (kind === "targets") {
        for (let i = 0; i < 3; i++) {
            const o = obj(150 + i * 240, FLOOR_Y, "#f59e0b", "target");
            o.alive = i === 0;
            state.objects.push(o);

    }
    else if (kind === "ducks") {
        for (let i = 0; i < 3; i++) {
            const o = obj(150 + i * 240, FLOOR_Y, "#f59e0b", "target");
            o.vy = i % 2 === 0 ? 2.2 : -2.2; // reused as horizontal speed
            state.objects.push(o);
        }
    }
    else if (kind === "rats") {
        for (let i = 0; i < 4; i++) {
            const o = obj(120 + i * 180, FLOOR_Y, "#57534e", "rat");
            o.vy = i % 2 === 0 ? 1.8 : -1.8;

/** Returns coins earned when the mini-game ends, or null while it is still running. */
function updateMinigame(m, keys) {

        return null;
    if (keys["a"] || keys["arrowleft"])
        m.playerX -= 6;
    if (keys["d"] || keys["arrowright"])
        m.playerX += 6;
    m.playerX = Math.max(30, Math.min(MINIGAME_WIDTH - 30, m.playerX));
    m.timer--;
    const mech = MINIGAMES[m.kind].mech;
    if (mech === "catch") {
        m.spawnTimer--;
        if (m.spawnTimer <= 0) {
            if (m.kind === "loaves") {
                m.spawnTimer = 40 + Math.floor(Math.random() * 30);
                m.objects.push(obj(60 + Math.random() * (MINIGAME_WIDTH - 120), -20, "#d97706", "loaf", 2.6 + Math.random() * 1.6));
            }
            else if (m.kind === "pies") {
                m.spawnTimer = 48 + Math.floor(Math.random() * 30);
                const burnt = Math.random() < 0.28;
                m.objects.push(obj(60 + Math.random() * (MINIGAME_WIDTH - 120), -20, burnt ? "#1c1917" : "#fbbf24", burnt ? "burnt" : "pie", 2.3 + Math.random() * 1.3));
            }
            else {
                // buttons
                m.spawnTimer = 40 + Math.floor(Math.random() * 26);
                const f = randomFlower();
                m.objects.push(obj(60 + Math.random() * (MINIGAME_WIDTH - 120), -20, f.color, f.name, 2.3 + Math.random() * 1.4));
                if (Math.random() < 0.22)
                    m.prompt = randomFlower().name;
            }
        }
        for (const o of m.objects) {
            if (!o.alive)
                continue;
            o.y += o.vy;
            const caught = Math.abs(o.x - m.playerX) < 42 && o.y > FLOOR_Y - 60 && o.y < FLOOR_Y + 10;
            if (caught) {
                o.alive = false;
                const good = m.kind === "buttons" ? o.tag === m.prompt : o.tag !== "burnt";
                if (good) {
                    m.score++;
                    sfx.coin();
                }
                else {
                    m.score = Math.max(0, m.score - 1);
                    sfx.deny();
                }
            }
            else if (o.y > FLOOR_Y + 20) {
                o.alive = false;
            }
        }
        m.objects = m.objects.filter((o) => o.alive);
    }
    else if (mech === "dodge") {
        // Fenwick lobs sandbags: survive, and the score ticks up as the seconds pass.
        m.spawnTimer--;

            m.spawnTimer = 38 + Math.floor(Math.random() * 26);
            m.objects.push(obj(60 + Math.random() * (MINIGAME_WIDTH - 120), -20, "#a8a29e", "sandbag", 3 + Math.random() * 1.6));
        }
        if (m.timer % 30 === 0)
            m.score++;
        for (const o of m.objects) {
            if (!o.alive)
                continue;
            o.y += o.vy;
            if (Math.abs(o.x - m.playerX) < 32 && o.y > FLOOR_Y - 54 && o.y < FLOOR_Y + 6) {
                o.alive = false;
                m.score = Math.max(0, m.score - 4);
                sfx.hurt();
            }
            else if (o.y > FLOOR_Y + 20) {
                o.alive = false;
            }
        }
        m.objects = m.objects.filter((o) => o.alive);
    }
    else if (mech === "herd") {
        for (const o of m.objects) {
            o.wobble += 0.07;
            // Sheep drift lazily on their own; vy is reused as sideways speed.
            o.x += o.vy;
            o.vy *= 0.94;
            if (Math.random() < 0.01)
                o.vy += (Math.random() - 0.5) * 1.2;
            if (keys["e"] && Math.abs(o.x - m.playerX) < 62) {
                keys["e"] = false;
                o.vy = m.playerX < o.x ? 5.5 : -2.5;
                sfx.talk();
            }
            if (o.x > MINIGAME_WIDTH - 78) {
                m.score++;
                sfx.coin();
                o.x = 60;
                o.vy = 0;
            }
            o.x = Math.max(40, Math.min(MINIGAME_WIDTH - 60, o.x));
        }
    }
    else if (mech === "pick") {
        for (const o of m.objects) {
            o.wobble += m.kind === "feed" ? 0.08 : 0.05;
            if (m.kind === "corn") {
                // Ripen on a timer: vy counts down, then the cob turns golden.
                if (o.tag === "green") {
                    o.vy--;
                    if (o.vy <= 0) {
                        o.tag = "ripe";
                        o.color = "#facc15";
                    }
                }
                if (keys["e"] && Math.abs(o.x - m.playerX) < 48) {
                    keys["e"] = false;
                    if (o.tag === "ripe") {
                        m.score++;
                        sfx.coin();
                    }
                    else {
                        m.score = Math.max(0, m.score - 1);
                        sfx.deny();
                    }
                    o.tag = "green";
                    o.color = "#4d7c0f";
                    o.vy = 60 + Math.random() * 150;
                }
                continue;
            }
            if (m.kind === "feed") {
                if (o.alive && keys["e"] && Math.abs(o.x - m.playerX) < 55) {
                    keys["e"] = false;
                    m.score++;
                    sfx.chest();
                    o.x = 80 + Math.random() * (MINIGAME_WIDTH - 160);
                }
                continue;
            }
            // flowers
            if (keys["e"] && Math.abs(o.x - m.playerX) < 45) {
                keys["e"] = false;
                if (o.tag === m.prompt) {
                    m.score++;
                    sfx.coin();
                }
                else {
                    m.score = Math.max(0, m.score - 1);
                    sfx.deny();
                }
                const f = randomFlower();
                o.tag = f.name;
                o.color = f.color;
                m.prompt = randomFlower().name;
            }
        }
    }
    else {
        // whack — targets, ducks, rats, moths
        const moving = m.kind !== "targets";
        for (const o of m.objects) {
            o.wobble += 0.1;
            if (moving && o.alive) {
                o.x += o.vy;
                if (o.x < 50 || o.x > MINIGAME_WIDTH - 50)
                    o.vy *= -1;
                if (m.kind === "moths")
                    o.y += Math.sin(o.wobble) * 1.4;
            }
            const reach = m.kind === "moths" ? 62 : 55;
            if (o.alive && keys["f"] && Math.abs(o.x - m.playerX) < reach) {
                keys["f"] = false;
                o.alive = false;
                m.score++;
                sfx.furryHit();
                m.spawnTimer = m.kind === "targets" ? 20 : 32;
            }
        }
        if (m.kind === "targets") {
            if (!m.objects.some((o) => o.alive)) {
                m.spawnTimer--;
                if (m.spawnTimer <= 0) {
                    const pick = m.objects[Math.floor(Math.random() * m.objects.length)];
                    pick.x = 80 + Math.random() * (MINIGAME_WIDTH - 160);
                    pick.alive = true;
                }
            }
        }
        else {
            // Moving ones come back one at a time after a short pause.
            m.spawnTimer--;
            const dead = m.objects.filter((o) => !o.alive);
            if (m.spawnTimer <= 0 && dead.length > 0) {
                const pick = dead[Math.floor(Math.random() * dead.length)];
                pick.alive = true;
                pick.x = 60 + Math.random() * (MINIGAME_WIDTH - 120);
                pick.vy = (Math.random() < 0.5 ? -1 : 1) * (1.8 + Math.random() * 1.2);
                m.spawnTimer = 30;
            }
        }
    }
    if (m.timer <= 0) {
        m.finished = true;
        const bonus = m.score > m.best ? 10 : 0;
        m.payout = m.score * 2 + bonus;
        m.best = Math.max(m.best, m.score);
        return m.payout;
    }

}

function loadProgress() {

        state.menuConfirm = false;
    }
    else if (key === "s" || key === "arrowdown") {
        state.menuCursor = (state.menuCursor + 1) % items.length;
        state.menuConfirm = false;
    }
    else if (key === "enter" || key === "e" || key === " ") {

        const nx = platform.axis === "x" ? bx + offset : bx;

const VILLAGE_SOLIDS = villageSolids();
function overlaps(x, y, w, h, r) {
    return x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y;
}
/** 8-way movement with per-axis collision against the town's solid rects. */
function moveTopDown(state) {
    const p = state.player;
    const keys = state.keys;
    const sprinting = keys["shift"] && p.hunger > 0;
    const speed = sprinting ? SPRINT_SPEED * 0.8 : WALK_SPEED;
    let dx = 0;
    let dy = 0;
    if (keys["a"] || keys["arrowleft"])
        dx -= 1;
    if (keys["d"] || keys["arrowright"])
        dx += 1;
    if (keys["w"] || keys["arrowup"])
        dy -= 1;
    if (keys["s"] || keys["arrowdown"])
        dy += 1;
    if (dx !== 0 && dy !== 0) {
        dx *= Math.SQRT1_2;
        dy *= Math.SQRT1_2;
    }
    if (dx !== 0 || dy !== 0) {
        p.walkT += 0.25;
        if (Math.abs(dx) >= Math.abs(dy))
            p.facing4 = dx < 0 ? "left" : "right";
        else
            p.facing4 = dy < 0 ? "up" : "down";
        if (dx < 0)
            p.facing = "left";
        else if (dx > 0)
            p.facing = "right";
        if (sprinting) {
            p.hunger = Math.max(0, p.hunger - 0.008);
            if (p.hunger <= 0)
                showMessage(state, "Too hungry to sprint!");
        }
    }
    // Collision box: the knight's feet only, so he can walk in front of walls.
    const bw = p.width - 6;
    const bh = 18;
    const bx = () => p.x + 3;
    const by = () => p.y + p.height - bh;
    p.x += dx * speed;
    for (const r of VILLAGE_SOLIDS) {
        if (!overlaps(bx(), by(), bw, bh, r))
            continue;
        p.x = dx > 0 ? r.x - bw - 3 : r.x + r.w - 3;
    }
    p.y += dy * speed;
    for (const r of VILLAGE_SOLIDS) {
        if (!overlaps(bx(), by(), bw, bh, r))
            continue;
        p.y = dy > 0 ? r.y - p.height : r.y + r.h - p.height + bh;
    }
    p.x = clamp(p.x, 0, VILLAGE_W - p.width);
    p.y = clamp(p.y, 0, VILLAGE_H - p.height);
    p.vx = 0;
    p.vy = 0;
    p.onGround = true;
    // Camera follows in both axes.
    state.cameraX += (p.x + p.width / 2 - CANVAS_WIDTH / 2 - state.cameraX) * 0.12;
    state.cameraY += (p.y + p.height / 2 - CANVAS_HEIGHT / 2 - state.cameraY) * 0.12;
    state.cameraX = clamp(state.cameraX, 0, VILLAGE_W - CANVAS_WIDTH);
    state.cameraY = clamp(state.cameraY, 0, VILLAGE_H - CANVAS_HEIGHT);
}
function updateVillage(state) {
    const p = state.player;
    moveTopDown(state);
    if (state.mode !== "playing")
        return;
    const f = feet(p);
    // World map board
    if (Math.hypot(f.x - BOARD_POS.x, f.y - BOARD_POS.y) < 90) {
        if (state.keys["e"]) {
            state.keys["e"] = false;
            state.mode = "map";
            state.mapView = "chapters";
            state.mapCursor = state.selectedLevel;
            sfx.talk();
            return;
        }
        showMessage(state, "Press E to read the world map", 20);
    }
    // Portal
    if (Math.hypot(f.x - PORTAL_POS.x, f.y - PORTAL_POS.y) < 100) {
        if (state.keys["e"]) {
            state.keys["e"] = false;
            state.pendingLevel = state.selectedLevel;
            state.mode = "levelstart";
            sfx.buy();
            return;
        }
        showMessage(state, `Press E to enter the ${sceneLabel(state.selectedLevel, state.selectedScene)} portal`, 20);
    }
    const npc = nearestNpc(state);
    if (!npc || !state.keys["e"])
        return;
    state.keys["e"] = false;
    if (npc.kind === "shop") {
        state.mode = "shop";
        state.shopMessage = "";
        sfx.talk();
        return;
    }
    if (npc.minigames && npc.minigames.length > 0) {
        // The villager says their piece first, then the three tasks are offered.
        state.taskNpc = npc.id;
        startDialog(state, npc.name, npc.lines, npc.portrait ?? "");
        return;
    }
    state.taskNpc = "";
    startDialog(state, npc.name, npc.lines, npc.portrait ?? "");
}
/* ---------------- Coins, enemies, arrows ---------------- */
function spawnCoins(state, x, y, count) {
    for (let i = 0; i < count; i++) {
        state.coins.push({
            x: x + (Math.random() - 0.5) * 30,
            y: y - Math.random() * 20,
            vy: -3 - Math.random() * 2,
            value: 1,
            spin: Math.random() * Math.PI,
        });
    }
}
function updateCoins(state) {
    const p = state.player;
    for (let i = state.coins.length - 1; i >= 0; i--) {
        const c = state.coins[i];
        c.vy += GRAVITY * 0.4;
        c.y = Math.min(GROUND_Y - 12, c.y + c.vy);
        if (c.y >= GROUND_Y - 12)
            c.vy = 0;
        c.spin += 0.15;
        const dx = p.x + p.width / 2 - c.x;
        const dy = p.y + p.height / 2 - c.y;
        if (Math.hypot(dx, dy) < 46) {
            p.coins += c.value;
            sfx.coin();
            state.coins.splice(i, 1);
        }
    }
}
const FOOD_INFO = {
    berries: { label: "some berries", hunger: 1 },
    apple: { label: "an apple", hunger: 1.5 },
    cheese: { label: "a wedge of cheese", hunger: 2 },
    bread: { label: "a loaf of bread", hunger: 2.5 },
    chicken: { label: "a roast chicken leg", hunger: 3.5 },
};
const FOOD_KINDS = ["berries", "apple", "cheese", "bread", "chicken"];
function spawnFoods(state, x, y, count) {
    for (let i = 0; i < count; i++) {
        state.foods.push({
            kind: FOOD_KINDS[Math.floor(Math.random() * FOOD_KINDS.length)],
            x: x + (Math.random() - 0.5) * 40,
            y: y - Math.random() * 20,
            vy: -4 - Math.random() * 2,
            bob: Math.random() * Math.PI * 2,
        });

}
function updateFoods(state) {
    const p = state.player;
    for (let i = state.foods.length - 1; i >= 0; i--) {
        const f = state.foods[i];
        f.vy += GRAVITY * 0.4;
        f.y = Math.min(GROUND_Y - 12, f.y + f.vy);
        if (f.y >= GROUND_Y - 12)
            f.vy = 0;
        f.bob += 0.12;
        const dx = p.x + p.width / 2 - f.x;
        const dy = p.y + p.height / 2 - f.y;
        if (Math.hypot(dx, dy) < 46) {
            const info = FOOD_INFO[f.kind];
            p.hunger = Math.min(p.maxHunger, p.hunger + info.hunger);
            sfx.eat();
            spawnParticle(state, f.x, f.y, "#fca5a5", 5, 2);
            showMessage(state, `Ate ${info.label}! +${info.hunger} hunger`);
            state.foods.splice(i, 1);
        }
    }
}
function drawFood(ctx, f, cameraX) {
    const x = f.x - cameraX;
    if (x < -30 || x > CANVAS_WIDTH + 30)
        return;
    const y = f.y + Math.sin(f.bob) * 2;
    ctx.save();
    ctx.translate(x, y);
    if (f.kind === "bread") {
        ctx.fillStyle = "#c2833a";
        ctx.beginPath();
        ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#7c4a12";
        ctx.lineWidth = 2;
        for (const off of [-5, 0, 5]) {
            ctx.beginPath();
            ctx.moveTo(off - 2, -5);
            ctx.lineTo(off + 2, -1);
            ctx.stroke();
        }
    }
    else if (f.kind === "apple") {
        ctx.fillStyle = "#dc2626";
        ctx.beginPath();
        ctx.arc(0, 1, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#7c2d12";
        ctx.fillRect(-1, -12, 2, 6);
        ctx.fillStyle = "#16a34a";
        ctx.beginPath();
        ctx.ellipse(6, -9, 6, 3, -0.5, 0, Math.PI * 2);
        ctx.fill();
    }
    else if (f.kind === "cheese") {
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.moveTo(-11, 7);
        ctx.lineTo(11, 7);
        ctx.lineTo(-11, -7);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#f59e0b";
        ctx.beginPath();
        ctx.arc(-4, 2, 2.4, 0, Math.PI * 2);
        ctx.arc(2, 5, 1.8, 0, Math.PI * 2);
        ctx.fill();
    }
    else if (f.kind === "chicken") {
        ctx.fillStyle = "#a16207";
        ctx.beginPath();
        ctx.ellipse(2, 0, 10, 7, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#f5f5f4";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-5, 3);
        ctx.lineTo(-12, 8);
        ctx.stroke();
    }
    else {
        ctx.fillStyle = "#7e22ce";
        for (const [bx, by] of [[-5, 2], [4, 3], [0, -4]]) {
            ctx.beginPath();
            ctx.arc(bx, by, 4.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.strokeStyle = "#16a34a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(6, -12);
        ctx.stroke();
    }
    ctx.restore();
}
function drawFoods(ctx, state) {
    for (const f of state.foods)
        drawFood(ctx, f, state.cameraX);
}
const HIT_SOUND = {
    furry: () => sfx.furryHit(),
    tentacle: () => sfx.tentacleHit(),

    winged: () => sfx.wingedHit(),

function damageEnemy(state, e, amount) {

    e.flash = 10;

    spawnParticle(state, e.x + e.width / 2, e.y + e.height / 2, "#22c55e", 5, 3);
    if (e.health <= 0) {
        spawnExplosion(state, e.x + e.width / 2, e.y + e.height / 2);
        spawnCoins(state, e.x + e.width / 2, e.y + e.height / 2, 1 + Math.floor(Math.random() * 3));
    }
}
function updateEnemies(state) {
    const p = state.player;
    for (const e of state.enemies) {
        if (e.health <= 0)
            continue;
        if (e.kind === "fish") {
            const dx = p.x + p.width / 2 - (e.x + e.width / 2);
            const dy = p.y + p.height / 2 - (e.y + e.height / 2);
            const dist = Math.hypot(dx, dy) || 1;
            e.vx += (dx / dist) * 0.06;
            e.vy += (dy / dist) * 0.05;
            e.vx = clamp(e.vx, -2.4, 2.4);
            e.vy = clamp(e.vy, -2, 2);
            e.x += e.vx;
            e.y += e.vy;
            e.x = clamp(e.x, e.patrolStart - 200, e.patrolEnd + 200);
            e.y = clamp(e.y, 80, GROUND_Y - e.height);
            e.wobble += 0.2;
        }
        else if (e.kind === "insect") {
            e.x += e.vx;
            if (e.x <= e.patrolStart || e.x + e.width >= e.patrolEnd)
                e.vx *= -1;
            e.wobble += 0.16;
            e.y = e.baseY - Math.abs(Math.sin(e.wobble)) * 34;
        }
        else {
            e.x += e.vx;
            if (e.x <= e.patrolStart || e.x + e.width >= e.patrolEnd)
                e.vx *= -1;
            e.x = clamp(e.x, e.patrolStart, e.patrolEnd - e.width);
            e.wobble += e.kind === "winged" ? 0.12 : 0.06;
            if (e.kind === "winged")
                e.y = e.baseY + Math.sin(e.wobble) * 40;
            else if (e.kind === "tentacle")
                e.y = e.baseY + Math.sin(e.wobble) * 3;
        }
        if (e.flash > 0)
            e.flash--;
        if (rectsOverlap(p, e) && p.invulnerable <= 0) {
            p.health = Math.max(0, p.health - 1);
            p.invulnerable = 40;
            p.vx = p.x < e.x ? -6 : 6;
            p.vy = -4;
            sfx.hurt();
            showMessage(state, "Ouch!", 60);
        }
        if (p.weapon === "sword" && p.attacking && p.attackTimer > 6) {
            const reach = 50;
            const attackBox = {
                x: p.facing === "right" ? p.x + p.width : p.x - reach,
                y: p.y,
                width: reach,
                height: p.height,
            };
            if (rectsOverlap(attackBox, e))
                damageEnemy(state, e, 1);
        }
    }
    state.enemies = state.enemies.filter((e) => e.health > 0);
}
function updateArrows(state) {
    for (let i = state.arrows.length - 1; i >= 0; i--) {
        const a = state.arrows[i];
        a.x += a.vx;
        a.y += a.vy;
        a.vy += state.swim ? 0.02 : 0.06;
        a.life--;
        let hit = false;
        for (const e of state.enemies) {
            if (e.health <= 0)
                continue;
            if (rectsOverlap({ x: a.x - 4, y: a.y - 2, width: 12, height: 5 }, e)) {
                damageEnemy(state, e, 1);
                hit = true;
                break;
            }
        }
        const b = state.boss;
        if (!hit && b && rectsOverlap({ x: a.x - 4, y: a.y - 2, width: 12, height: 5 }, b)) {
            spawnParticle(state, a.x, a.y, "#94a3b8", 4, 2);
            hit = true;
        }
        if (hit || a.life <= 0 || a.y > GROUND_Y)
            state.arrows.splice(i, 1);
    }
    state.enemies = state.enemies.filter((e) => e.health > 0);
}
function updateChests(state) {
    const p = state.player;
    if (!state.keys["e"])
        return;
    let used = false;
    for (const chest of state.chests) {
        if (chest.opened)
            continue;
        const dx = p.x + p.width / 2 - (chest.x + chest.width / 2);
        const dy = p.y + p.height / 2 - (chest.y + chest.height / 2);
        if (Math.hypot(dx, dy) < 60) {
            chest.opened = true;
            used = true;
            sfx.chest();
            spawnCoins(state, chest.x + chest.width / 2, chest.y, 3 + Math.floor(Math.random() * 4));
            if (chest.item !== "food" && Math.random() < 0.6) {
                spawnFoods(state, chest.x + chest.width / 2, chest.y, 1);
            }
            spawnParticle(state, chest.x + chest.width / 2, chest.y + chest.height / 2, "#eab308", 8, 3);
            if (chest.item === "bandage") {
                p.health = Math.min(p.maxHealth, p.health + 2.5);
                showMessage(state, "Bandage! +2.5 health");
            }
            else if (chest.item === "firstaid") {
                p.health = p.maxHealth;
                showMessage(state, "First aid kit! Full health");
            }
            else if (chest.item === "food") {
                spawnFoods(state, chest.x + chest.width / 2, chest.y, 2 + Math.floor(Math.random() * 2));
                showMessage(state, "Food spills out! Grab it to eat");
            }
            else {
                p.arrowsLeft += 12;
                showMessage(state, "+12 arrows");
            }
        }
    }
    for (const pail of state.pails) {
        const dx = p.x + p.width / 2 - (pail.x + pail.width / 2);
        if (Math.abs(dx) < 70 && Math.abs(p.y - pail.y) < 90 && p.tnt < 5) {
            p.tnt = 5;
            used = true;
            showMessage(state, "Took TNT from the pail (5)", 80);
        }
    }
    if (used)
        state.keys["e"] = false;

/* ---------------- Bosses ---------------- */
function bossAttack(state, b) {
    const def = BOSSES[b.kind];
    const p = state.player;
    const from = { x: b.x + b.width / 2, y: b.y + b.height / 2 };
    const push = (proj) => {
        b.projectiles.push({
            x: from.x,
            y: from.y,
            vx: 0,
            vy: 0,
            radius: 10,
            life: 200,
            color: def.projectileColor,
            shape: def.projectileShape,
            ...proj,
        });
    };
    const dx = p.x + p.width / 2 - from.x;
    const dy = p.y + p.height / 2 - from.y;
    const dist = Math.hypot(dx, dy) || 1;
    switch (b.kind) {
        case "cloud":
            // lightning drops straight down onto the knight
            push({ x: p.x + p.width / 2, y: b.y + b.height, vx: 0, vy: 9, radius: 9, life: 90 });
            break;
        case "wizard":
            push({ vx: (dx / dist) * 5, vy: (dy / dist) * 5, radius: 11, life: 160 });
            push({ vx: (dx / dist) * 4, vy: (dy / dist) * 4 - 1.6, radius: 8, life: 160 });
            break;
        case "gorilla":
        case "furryking":
            push({ vx: dx > 0 ? 6 : -6, vy: -7, radius: 12, life: 200 });
            break;
        case "owl":
            push({ vx: (dx / dist) * 6, vy: (dy / dist) * 6, radius: 8, life: 150 });
            break;
        case "shark": {
            // single aimed water bolt
            push({
                vx: (dx / dist) * 3,
                vy: (dy / dist) * 3,
                radius: 9,
                life: 170,
            });
            break;
        }
        case "scorpion":
            push({ vx: dx > 0 ? 7 : -7, vy: -2, radius: 8, life: 140 });
            break;
        case "yeti":
            push({ vx: dx > 0 ? 5.5 : -5.5, vy: -5, radius: 12, life: 200 });
            break;
        case "crab":
            push({ vx: dx > 0 ? 5 : -5, vy: -6, radius: 10, life: 180 });
            push({ vx: dx > 0 ? 3 : -3, vy: -8, radius: 8, life: 180 });
            break;
        default:
            sfx.dragonFire();
            push({ vx: dx * 0.006, vy: 3 + Math.random() * 2, radius: 11, life: 180 });
    }
}
function updateBoss(state) {
    const b = state.boss;
    if (!b)
        return;
    const def = BOSSES[b.kind];
    const p = state.player;
    const arenaX = state.bossArenaX;
    b.timer++;
    if (b.flash > 0)
        b.flash--;
    for (let i = b.projectiles.length - 1; i >= 0; i--) {
        const fb = b.projectiles[i];
        fb.x += fb.vx;
        fb.y += fb.vy;
        if (fb.shape === "rock" || fb.shape === "ball")
            fb.vy += 0.12;
        fb.life--;
        if (fb.life <= 0 || fb.y > GROUND_Y + 20) {
            b.projectiles.splice(i, 1);
            continue;
        }
        const cx = p.x + p.width / 2;
        const cy = p.y + p.height / 2;
        if (Math.hypot(fb.x - cx, fb.y - cy) < fb.radius + p.width / 2 && p.invulnerable <= 0) {
            p.health = Math.max(0, p.health - 1);
            p.invulnerable = 40;
            b.projectiles.splice(i, 1);
            sfx.hurt();
            showMessage(state, "Hit!", 50);
        }
    }
    switch (b.state) {
        case "active": {
            if (b.flying) {
                b.y = b.hoverY + Math.sin(b.timer * 0.05) * 22;
                b.x += b.dir * def.speed;
                if (b.x < arenaX - 120)
                    b.dir = 1;
                if (b.x > arenaX + 520)
                    b.dir = -1;
            }
            else {
                // charges towards the knight along the ground
                const target = p.x + p.width / 2 - b.width / 2;
                b.dir = target > b.x ? 1 : -1;
                b.x += b.dir * def.speed;
                b.x = clamp(b.x, arenaX - 200, arenaX + 620);
                b.y = b.restY - Math.abs(Math.sin(b.timer * 0.08)) * 6;
                if (rectsOverlap(p, b) && p.invulnerable <= 0) {
                    p.health = Math.max(0, p.health - 1);
                    p.invulnerable = 50;
                    p.vx = b.dir * 8;
                    p.vy = -6;
                    sfx.hurt();
                }
            }
            if (b.timer % def.attackEvery === 0)
                bossAttack(state, b);
            if (b.timer > def.activeFrames) {
                b.state = "landing";
                b.timer = 0;
            }
            break;
        }
        case "landing": {
            b.y += (b.restY - b.y) * 0.09;
            if (Math.abs(b.y - b.restY) < 2) {
                b.y = b.restY;
                b.state = "resting";
                b.timer = 0;
                showMessage(state, `${b.name} is tired — throw TNT with E!`, 90);
            }
            break;
        }
        case "resting": {
            if (b.timer > def.restFrames) {
                b.state = "taking_off";
                b.timer = 0;
            }
            break;
        }
        case "taking_off": {
            b.y += (b.hoverY - b.y) * 0.09;
            if (Math.abs(b.y - b.hoverY) < 2) {
                b.y = b.hoverY;
                b.state = "active";
                b.timer = 0;
                b.restCount++;
            }
            break;
        }
    }
    if (b.state === "resting" && state.keys["e"] && p.tnt > 0 && state.tntList.length < 3) {
        const dist = Math.hypot(p.x + p.width / 2 - (b.x + b.width / 2), p.y + p.height / 2 - (b.y + b.height / 2));
        if (dist < 340) {
            p.tnt--;
            state.tntList.push({
                x: p.x + p.width / 2,
                y: p.y + p.height / 2,
                vx: p.facing === "right" ? 9 : -9,
                vy: -6,
                fuse: 55,
                exploded: false,
            });
            state.keys["e"] = false;
        }
    }
}
function defeatBoss(state, b) {
    sfx.dragonRoar(0.55);
    spawnExplosion(state, b.x + b.width / 2, b.y + b.height / 2);
    spawnExplosion(state, b.x + b.width / 2 + 40, b.y + b.height / 2);
    spawnCoins(state, b.x + b.width / 2, b.y + b.height / 2, 12);
    state.boss = null;
    state.bossDefeated = true;
    if (state.levelIndex === FINAL_LEVEL_INDEX) {
        playMusic(null);
        state.keyDrop = { x: b.x + b.width / 2, y: b.y + b.height / 2, vy: 0, collected: false };
        showMessage(state, "The dragon explodes and drops the cage key!", 220);
        return;
    }
    playMusic(null);
    state.flagDrop = {
        x: b.x + b.width / 2,
        y: b.y + b.height / 2,
        vy: -4,
        planted: false,
        collected: false,
        color: FLAG_COLORS[state.biome] ?? "#facc15",
        wave: 0,
        big: true,
        isSceneExit: false,
    };
    showMessage(state, `${b.name} defeated! Grab the big victory flag!`, 200);

/** The intro is told as a storybook: the tale on the left page, the scene on the right. */
function drawIntro(ctx, state) {
    const t = state.cutsceneTimer;
    // Table the book rests on.
    const table = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
    table.addColorStop(0, "#3b2415");
    table.addColorStop(1, "#1c1008");
    ctx.fillStyle = table;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    const open = Math.min(1, t / 45);
    const bookX = 26;
    const bookY = 30;
    const bookW = CANVAS_WIDTH - 52;
    const bookH = CANVAS_HEIGHT - 60;
    ctx.save();
    ctx.translate(CANVAS_WIDTH / 2, 0);

    ctx.translate(-CANVAS_WIDTH / 2, 0);

    const ph = bookH - pad * 2;

    ctx.beginPath();
    ctx.rect(px, py, pw, ph);
    ctx.clip();
    ctx.fillStyle = "#1e1b4b";
    ctx.fillRect(px, py, pw, ph);
    const s = Math.min(pw / CANVAS_WIDTH, ph / CANVAS_HEIGHT);
    ctx.translate(px + pw / 2, py + ph / 2);
    ctx.scale(s, s);
    ctx.translate(-CANVAS_WIDTH / 2, -CANVAS_HEIGHT / 2);
    drawIntroScene(ctx, state);
    ctx.restore();
    ctx.strokeStyle = "#8b6f47";
    ctx.lineWidth = 3;
    ctx.strokeRect(px, py, pw, ph);

    ctx.fillStyle = "#6b3f18";

        const faded = i < state.cutscenePhase;
        ctx.fillStyle = faded ? "#8a7350" : "#3f2d16";
        for (const row of wrapText(ctx, INTRO_LINES[i], CANVAS_WIDTH / 2 - bookX - 48)) {

    ctx.restore();

    ctx.font = "13px sans-serif";
    ctx.fillText("Press any key (or tap) to skip the story", 30, CANVAS_HEIGHT - 8);
}
function wrapText(ctx, text, maxWidth) {
    const words = text.split(" ");
    const rows = [];
    let current = "";
    for (const word of words) {
        const test = current ? `${current} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && current) {
            rows.push(current);
            current = word;
        }
        else {
            current = test;
        }
    }
    if (current)
        rows.push(current);
    return rows;
}

        drawIntro(ctx, state);
        return;

    if (state.mode === "minigame" && state.minigame) {

            if (platform.gone && platform.gone > 0)
                continue;
            const shake = platform.crumbleT && platform.crumbleT > 0 ? (Math.random() - 0.5) * 3 : 0;
            ctx.save();
            ctx.translate(shake, 0);
            if (platform.crumbleT && platform.crumbleT > 20)
                ctx.globalAlpha = 0.6;
            drawPlatform(ctx, platform, state.cameraX, state.biome);
            ctx.restore();
        }
        const now = Date.now();
        for (const b of state.bounces)
            drawMushroom(ctx, b, state.cameraX, now);
        drawSwings(ctx, state, now);
        drawFireJets(ctx, state);
        for (const chest of state.chests)
            drawChest(ctx, chest, state.cameraX);
        for (const pail of state.pails)
            drawPail(ctx, pail, state.cameraX);
        for (const e of state.enemies)
            drawEnemy(ctx, e, state.cameraX);
        drawCage(ctx, state);
        drawKeyDrop(ctx, state);
        drawFlagDrop(ctx, state);
        drawCoins(ctx, state);
        drawFoods(ctx, state);
        if (state.boss)
            drawBoss(ctx, state.boss, state.cameraX);
        drawPuddles(ctx, state);
        drawPlayer(ctx, state.player, state.cameraX);
        for (const t of state.tntList)
            drawTNT(ctx, t, state.cameraX);
        for (const a of state.arrows)
            drawArrow(ctx, a, state.cameraX);
        drawFallers(ctx, state);
        drawParticles(ctx, state);
        drawTideWater(ctx, state);
        drawFogOverlay(ctx, state);
        drawDarknessOverlay(ctx, state);
        if (state.timeLimit > 0) {
            const secs = Math.ceil(state.timeLeft / 60);
            ctx.font = "bold 30px system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.fillStyle = "rgba(0,0,0,0.45)";
            ctx.fillRect(CANVAS_WIDTH / 2 - 70, 16, 140, 44);
            ctx.fillStyle = secs <= 10 ? "#f87171" : "#fde68a";
            ctx.fillText(`${secs}s`, CANVAS_WIDTH / 2, 48);
            ctx.textAlign = "left";
        }
    }
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, CANVAS_HEIGHT - 30, CANVAS_WIDTH, 30);
    ctx.fillStyle = "#ffffff";
    ctx.font = "13px sans-serif";
    ctx.fillText(state.topDown
        ? "Arrows/WASD: walk any direction • Shift: run • E: talk, shop, map board, portal"
        : state.swim
            ? "A/D: swim • W/Space: rise • S: dive • R: sword/bow • F: attack • E: chests"
            : "A/D: walk • Shift: sprint • Space: jump • R: sword/bow • F: attack • E: interact, TNT pail", 12, CANVAS_HEIGHT - 10);
    if (state.levelBanner > 0) {
        state.levelBanner--;
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 22px sans-serif";
        const name = state.levelName;
        ctx.fillText(name, CANVAS_WIDTH / 2 - ctx.measureText(name).width / 2, 90);
    }
    else if (state.biomeLabelTimer > 0) {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px sans-serif";
        const name = BIOME_NAMES[state.biome];
        ctx.fillText(name, CANVAS_WIDTH / 2 - ctx.measureText(name).width / 2, 120);
    }
    if (state.boss && state.boss.state === "resting") {
        ctx.fillStyle = "#facc15";
        ctx.font = "bold 16px sans-serif";
        const t = state.player.tnt > 0
            ? `${state.boss.name.toUpperCase()} IS DOWN — Press E to throw TNT!`
            : `${state.boss.name.toUpperCase()} IS DOWN — Get TNT from a pail!`;
        ctx.fillText(t, CANVAS_WIDTH / 2 - ctx.measureText(t).width / 2, 80);
    }
    if (state.player.hasKey && state.cage && !state.cage.open) {
        ctx.fillStyle = "#facc15";
        ctx.font = "bold 15px sans-serif";
        const t = "You have the key — run right to the cage and press E!";
        ctx.fillText(t, CANVAS_WIDTH / 2 - ctx.measureText(t).width / 2, 104);
    }
    if (state.flagDrop && !state.flagDrop.collected) {
        ctx.fillStyle = "#4ade80";
        ctx.font = "bold 16px sans-serif";
        const t = state.flagDrop.isSceneExit
            ? "Reach the flag at the end to enter the next scene!"
            : "Grab the big victory flag to finish the chapter!";
        ctx.fillText(t, CANVAS_WIDTH / 2 - ctx.measureText(t).width / 2, 80);
    }
    if (state.celebrateTimer > 0) {
        ctx.fillStyle = state.celebrateBig ? "#facc15" : "#4ade80";
        ctx.font = "bold 30px sans-serif";
        const t = state.celebrateBig ? "Chapter Clear!" : "Scene Clear!";
        ctx.fillText(t, CANVAS_WIDTH / 2 - ctx.measureText(t).width / 2, 120);
    }
    if (state.mode === "levelcomplete") {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = "#4ade80";
        ctx.font = "bold 32px sans-serif";
        const t = "Chapter Complete — big flag taken!";
        ctx.fillText(t, CANVAS_WIDTH / 2 - ctx.measureText(t).width / 2, CANVAS_HEIGHT / 2 - 20);
        ctx.fillStyle = "#ffffff";
        ctx.font = "16px sans-serif";
        const next = LEVELS[state.levelIndex + 1];
        const t2 = next ? `${next.short} unlocked — back to the village` : "Back to the village";
        ctx.fillText(t2, CANVAS_WIDTH / 2 - ctx.measureText(t2).width / 2, CANVAS_HEIGHT / 2 + 20);
    }
    if (state.mode === "levelstart")
        drawLevelStart(ctx, state);
    if (state.mode === "map")
        drawMapScreen(ctx, state);
    if (state.mode === "dialog")
        drawDialog(ctx, state);
    if (state.mode === "tasks")
        drawTasks(ctx, state);
    if (state.mode === "shop")
        drawShop(ctx, state);
}
(function () {
  const canvas = document.getElementById("game");
  canvas.width = CANVAS_WIDTH;
  canvas.height = CANVAS_HEIGHT;
  const ctx = canvas.getContext("2d");
  const state = createInitialState();
  window.__gs = state;
  const isTouch = window.matchMedia("(pointer: coarse)").matches;

  function drawHUD(ctx, state) {
    if (state.mode === "menu" || state.mode === "intro" || state.mode === "minigame" || state.mode === "map" || state.mode === "levelstart") return;
    const p = state.player, pad = 16, heartSize = 18, gap = 4;
    ctx.font = "bold 14px sans-serif";
    for (let i = 0; i < p.maxHealth; i++) {
      const x = pad + i * (heartSize + gap), y = pad;
      ctx.fillStyle = i < Math.floor(p.health) ? "#ef4444" : "#374151";
      ctx.beginPath();
      ctx.moveTo(x + heartSize / 2, y + 4);
      ctx.bezierCurveTo(x, y, x, y + heartSize / 1.5, x + heartSize / 2, y + heartSize);
      ctx.bezierCurveTo(x + heartSize, y + heartSize / 1.5, x + heartSize, y, x + heartSize / 2, y + 4);
      ctx.fill();
    }
    const barX = pad, barY = pad + heartSize + 8, barW = 120, barH = 12;
    ctx.fillStyle = "#374151"; ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = "#f59e0b"; ctx.fillRect(barX, barY, barW * (p.hunger / p.maxHunger), barH);
    ctx.strokeStyle = "#9ca3af"; ctx.lineWidth = 1; ctx.strokeRect(barX, barY, barW, barH);
    ctx.fillStyle = "#ffffff"; ctx.fillText("Hunger", barX + barW + 8, barY + 10);
    const infoY = barY + barH + 18;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(`Weapon: ${p.hasBow ? (p.weapon === "sword" ? "Sword" : "Bow") : "Sword"}${p.hasBow ? ` (R)   Arrows: ${p.arrowsLeft}` : "   Bow: locked"}   TNT: ${p.tnt}${p.hasKey ? "   Key: yes" : ""}`, barX, infoY);
    ctx.fillStyle = "#facc15"; ctx.fillText(`Coins: ${p.coins}`, barX, infoY + 20);
    if (p.items.length > 0) { ctx.fillStyle = "#a5b4fc"; ctx.fillText(`Carrying: ${p.items.join(", ")}`, barX + 90, infoY + 20); }
    ctx.fillStyle = "#e2e8f0"; ctx.font = "bold 13px sans-serif";
    ctx.fillText(state.levelName, barX, infoY + 40);
    ctx.font = "bold 14px sans-serif";
    const boss = state.boss;
    if (boss) {
      const dx = CANVAS_WIDTH - pad - 200, dy = pad;
      ctx.fillStyle = "#374151"; ctx.fillRect(dx, dy, 190, 16);
      ctx.fillStyle = "#dc2626"; ctx.fillRect(dx, dy, 190 * Math.max(0, boss.health / boss.maxHealth), 16);
      ctx.strokeStyle = "#9ca3af"; ctx.strokeRect(dx, dy, 190, 16);
      ctx.fillStyle = "#ffffff"; ctx.fillText(`${boss.name} ${Math.max(0, boss.health)}/${boss.maxHealth}`, dx, dy + 30);
    }
    if (state.message) {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, CANVAS_HEIGHT / 2 - 30, CANVAS_WIDTH, 60);
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px sans-serif";
      ctx.fillText(state.message, (CANVAS_WIDTH - ctx.measureText(state.message).width) / 2, CANVAS_HEIGHT / 2 + 6);
    }
    if (state.mode === "won") {
      ctx.fillStyle = "rgba(0,0,0,0.75)"; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.fillStyle = "#facc15"; ctx.font = "bold 36px sans-serif";
      ctx.fillText("The End", (CANVAS_WIDTH - ctx.measureText("The End").width) / 2, CANVAS_HEIGHT / 2);
      ctx.fillStyle = "#ffffff"; ctx.font = "16px sans-serif";
      const hint = "Press Enter to play again";
      ctx.fillText(hint, (CANVAS_WIDTH - ctx.measureText(hint).width) / 2, CANVAS_HEIGHT / 2 + 40);
    }
    if (state.mode === "gameover") {
      ctx.fillStyle = "rgba(0,0,0,0.75)"; ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.fillStyle = "#ef4444"; ctx.font = "bold 32px sans-serif";
      ctx.fillText("Game Over", (CANVAS_WIDTH - ctx.measureText("Game Over").width) / 2, CANVAS_HEIGHT / 2);
      ctx.fillStyle = "#ffffff"; ctx.font = "16px sans-serif";
      const hint = `Press Enter to retry ${state.levelName}`;
      ctx.fillText(hint, (CANVAS_WIDTH - ctx.measureText(hint).width) / 2, CANVAS_HEIGHT / 2 + 40);
      if (state.player.reachedVillage) {
        ctx.fillStyle = "#4ade80";
        const h2 = "Press V to respawn in the village";
        ctx.fillText(h2, (CANVAS_WIDTH - ctx.measureText(h2).width) / 2, CANVAS_HEIGHT / 2 + 68);
      }
    }
  }

  window.addEventListener("keydown", (e) => {
    unlockAudio();
    handleKeyDown(state, e.key.toLowerCase());
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener("keyup", (e) => handleKeyUp(state, e.key.toLowerCase()));

  canvas.addEventListener("click", (e) => {
    unlockAudio();
    state.started = true;
    const rect = canvas.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * CANVAS_WIDTH;
    const y = ((e.clientY - rect.top) / rect.height) * CANVAS_HEIGHT;
    if (handleMenuClick(state, x, y)) return;
    if (handleMapClick(state, x, y)) return;
    confirmLevelStart(state);
  });

  document.getElementById("menuBtn").addEventListener("click", () => {
    unlockAudio(); state.started = true; openMenu(state);
  });

  function press(k) { unlockAudio(); state.started = true; handleKeyDown(state, k); }
  function release(k) { handleKeyUp(state, k); }
  document.querySelectorAll("[data-key]").forEach((b) => {
    const k = b.getAttribute("data-key");
    b.addEventListener("contextmenu", (e) => e.preventDefault());
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); press(k); });
    b.addEventListener("pointerup", (e) => { e.preventDefault(); release(k); });
    b.addEventListener("pointercancel", () => release(k));
    b.addEventListener("pointerleave", () => release(k));
  });

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let scale;
    if (isTouch) {
      const cover = Math.max(vw / CANVAS_WIDTH, vh / CANVAS_HEIGHT);
      const contain = Math.min(vw / CANVAS_WIDTH, vh / CANVAS_HEIGHT);
      scale = Math.min(cover, contain * 1.18);
    } else {
      scale = Math.min(Math.min(vw - 16, 1120) / CANVAS_WIDTH, (vh - 90) / CANVAS_HEIGHT);
    }
    canvas.style.width = CANVAS_WIDTH * scale + "px";
    canvas.style.height = CANVAS_HEIGHT * scale + "px";
    document.getElementById("rotate").style.display = isTouch && vh > vw ? "flex" : "none";
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  resize();

  if (isTouch) {
    document.body.classList.add("touch");
  }

  (function loop() {
    updateGame(state);
    renderGame(ctx, state);
    drawHUD(ctx, state);
    requestAnimationFrame(loop);
  })();
})();
  </script>
</body>
</html>
